```html
<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Calculadora</title>

    <link rel="stylesheet" href="assets/css/style.css">
    <script src="assets/js/script.js" defer></script>
</head>

<body>

    <main class="calculadora">

        <div class="visor">
            <p id="resultado">0</p>
        </div>

        <section class="botoes">

            <div class="linha-botoes">
                <button class="botao botao-controle" id="limpar">C</button>
                <button class="botao botao-controle" id="voltar">&larr;</button>
                <button class="botao botao-operador" value="/">&divide;</button>
            </div>

            <div class="linha-botoes">
                <button class="botao" value="7">7</button>
                <button class="botao" value="8">8</button>
                <button class="botao" value="9">9</button>
                <button class="botao botao-operador" value="*">&times;</button>
            </div>

            <div class="linha-botoes">
                <button class="botao" value="4">4</button>
                <button class="botao" value="5">5</button>
                <button class="botao" value="6">6</button>
                <button class="botao botao-operador" value="-">&minus;</button>
            </div>

            <div class="linha-botoes">
                <button class="botao" value="1">1</button>
                <button class="botao" value="2">2</button>
                <button class="botao" value="3">3</button>
                <button class="botao botao-operador" value="+">&plus;</button>
            </div>

            <div class="linha-botoes">
                <button class="botao botao-zero" value="0">0</button>
                <button class="botao botao-igual" id="igual">&equals;</button>
            </div>

        </section>

    </main>

</body>
</html>
```
